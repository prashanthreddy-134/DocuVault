{% extends 'base.html' %}{% block content %}<div class="hero"><div><div class="eyebrow">REPOSITORY</div><h1>Documents</h1><p>Search and manage documents available to your account.</p></div><a class="btn btn-primary" href="{% url 'upload_document' %}">＋ Upload document</a></div><form class="filterbar" method="get"><input class="form-control" name="q" value="{{ q }}" placeholder="Search title, content, category or tags…"><select class="form-select" name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.id }}" {% if selected_category == c.id|stringformat:'s' %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><select class="form-select" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if selected_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}<option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select><button class="btn btn-primary">Search</button><a class="btn btn-light" href="{% url 'document_list' %}">Reset</a></form><div class="panel">{% include 'docs/table.html' %}</div>{% endblock %}
